[package]
name = "emojilm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
candle-core = "0.8.4"
candle-nn = "0.8.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "1.3", default-features = false }
